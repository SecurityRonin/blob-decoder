name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt · clippy · test (3 OS) · MSRV · cargo-deny · cargo-vet · secret scan ·
  # fuzz build-check · rustdoc · 100% per-line coverage · path-dep gate.
  #
  # No inputs: this repo already enforced a 100% per-line gate at
  # `--workspace --all-features`, which is exactly the shared workflow's default,
  # and MSRV is read from rust-version. Anything that needed configuring would be
  # a behaviour change smuggled in by an adoption PR, so there is nothing here.
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@9234e1fa9f85b14a8d6fddc7a8f7378f7e30b183
    with:
      # CARRIED ACROSS. The replaced gate excluded main.rs explicitly — its own
      # comment reads "main.rs (the Humble CLI shell) is excluded by the script".
      # Adoption dropped that, so the strict gate began demanding 100% line
      # coverage of a CLI shell this repo has never gated, and main went red on
      # 10 lines that were never in scope.
      #
      # Also worth recording: the old gate enforced 100% LINE *and FUNCTION*
      # coverage. The shared workflow has no function-coverage input, so that
      # half is dropped. A real reduction, stated here rather than left to be
      # found in a coverage report later.
      coverage-ignore-regex: '(^|/)src/main\.rs'
